name: CI

on:
  push:
    branches: [master, feat/local-fullstack, 'codex/**']
  pull_request:

jobs:
  vitest-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm ci
      - run: npm run lint:i18n
      - run: npm --workspace @autooffice/shared run test
      # No --coverage: the suite needs bun:sqlite, and bun's runtime has no v8
      # coverage APIs ("Coverage APIs are not supported").
      - run: npm --workspace @autooffice/server run test
      - run: npm --workspace @autooffice/web run test
      - run: npm --workspace @autooffice/web run build
      - run: npm --workspace @autooffice/server run build

  vitest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm ci
      - run: npm --workspace @autooffice/server run test
        # Exercises DPAPI + cert + scheduled-task helpers on real Windows.

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm ci
      - run: npx --workspace @autooffice/e2e playwright install --with-deps chromium
      - run: npm --workspace @autooffice/e2e run test

  build-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm ci
      - run: npm --workspace @autooffice/web run build
      - run: npm --workspace @autooffice/server run build
      - name: Smoke /health on the compiled binary
        shell: pwsh
        run: |
          Start-Process -FilePath "apps/server/dist/autoOffice-server.exe" -ArgumentList "" -PassThru | Out-Null
          Start-Sleep -Seconds 4
          $r = Invoke-WebRequest -Uri "http://localhost:47318/health" -UseBasicParsing
          if ($r.StatusCode -ne 200) { exit 1 }

  installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm ci
      - run: npm --workspace @autooffice/web run build
      - run: npm --workspace @autooffice/server run build
      - name: Install Inno Setup
        run: choco install -y innosetup
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'
      - name: Run installer silently
        run: '& installer/output/AutoOffice-Setup.exe /VERYSILENT /NORESTART'
      - name: /health after install
        shell: pwsh
        run: |
          # The scheduled task launches the 31 MB binary cold, so poll instead
          # of sleeping a fixed 8s.
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri "https://localhost:47318/health" -UseBasicParsing -SkipCertificateCheck -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "health OK"; exit 0 }
            } catch { Start-Sleep -Seconds 3 }
          }
          Write-Host "::error::/health never came up"
          exit 1
      - name: Diagnose a dead service
        if: failure()
        shell: pwsh
        run: |
          schtasks /Query /TN "AutoOffice\Service" /V /FO LIST
          Get-Process autoOffice-server -ErrorAction SilentlyContinue | Format-List Id,Path
          netstat -ano | Select-String 47318
          Get-ChildItem "$env:LOCALAPPDATA\AutoOffice" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,Length
          Get-ChildItem "$env:ProgramData\AutoOfficeAddin" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,Length
          Write-Host "--- launching the binary directly (10s, then killed) ---"
          $p = Start-Process -FilePath "$env:ProgramData\AutoOfficeAddin\autoOffice-server.exe" `
            -RedirectStandardOutput "$env:TEMP\ao-out.txt" -RedirectStandardError "$env:TEMP\ao-err.txt" -PassThru
          Start-Sleep -Seconds 10
          Get-Content "$env:TEMP\ao-out.txt","$env:TEMP\ao-err.txt" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Uninstall
        run: |
          Get-WmiObject -Query "SELECT * FROM Win32_Product WHERE Name LIKE 'AutoOffice%'" | ForEach-Object { $_.Uninstall() }
